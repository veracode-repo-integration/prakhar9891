spring:
  application:
    name: pos-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/posdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:4000}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Custom Security Props
jwt:
  secret: ${JWT_SECRET:pos_system_ultra_secure_secret_key_1234567890}
  expiration: 86400000

app:
  allowed:
    origins: ${ALLOWED_ORIGINS:http://localhost:8081,http://localhost:3000}

# GCP Configuration
gcp:
  project-id: ${GCP_PROJECT_ID:your-project-id}
  bucket-name: ${GCP_BUCKET_NAME:pos-system-images-99}
