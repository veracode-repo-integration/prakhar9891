# ☁️ SERVER CONFIG
server.port=${PORT:4000}
spring.application.name=pos-server

# ☁️ DIALECT AUTO-DETECTION
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ☁️ GOOGLE CLOUD OFFICIAL CONFIG (The Magic)
spring.cloud.gcp.sql.enabled=false
# spring.cloud.gcp.sql.instance-connection-name=udhyog-khaata-pos:us-central1:pos-db-instance
# spring.cloud.gcp.sql.database-name=posdb

# 🐘 DB Credentials
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/posdb}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:1234567890}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ⚡ Hikari Resilience - START AT ALL COSTS
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=60000

# 🛡️ JPA - LIVE TABLE SYNC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# 🔑 App Security
pos.jwt.secret=${JWT_SECRET_KEY:POS_ULTRA_SECURE_KEY_2026_PRO_SYSTEM_99}
app.allowed.origins=https://udhyog-khaata-pos.web.app,https://udhyog-khaata-pos.firebaseapp.com,http://localhost:8081

# ☁️ Cloud Storage
gcp.project-id=udhyog-khaata-pos
gcp.bucket-name=pos-system-images-99
firebase.project-id=udhyog-khaata-pos

# 🏥 Detailed Health & Logging
management.endpoint.health.show-details=always
management.health.db.enabled=true

# 📝 DIAGNOSTIC LOGGING
logging.level.root=INFO
logging.level.com.pos.server=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
