# ☁️ SERVER CONFIG
server.port=${PORT:4000}
spring.application.name=pos-server

# ☁️ GOOGLE CLOUD OFFICIAL CONFIG (The Magic)
spring.cloud.gcp.sql.instance-connection-name=udhyog-khaata-pos:us-central1:pos-db-instance
spring.cloud.gcp.sql.database-name=posdb

# 🐘 DB Credentials
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ⚡ Hikari Resilience - Fail fast to catch errors in logs
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=30000

# 🛡️ JPA - LIVE TABLE SYNC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# 🔑 App Security
pos.jwt.secret=${JWT_SECRET:POS_ULTRA_SECURE_KEY_2026_PRO_SYSTEM_99}
app.allowed.origins=*

# ☁️ Cloud Storage
gcp.project-id=udhyog-khaata-pos
gcp.bucket-name=pos-system-images-99

# 🏥 Detailed Health & Logging
management.endpoint.health.show-details=always
management.health.db.enabled=true

# 📝 DIAGNOSTIC LOGGING
logging.level.root=INFO
logging.level.com.pos.server=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.google.cloud.sql.postgres=DEBUG
