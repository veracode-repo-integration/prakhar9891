spring.application.name=pos-server
server.port=8080

# 🚩 Production Database Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ⚡ Performance Tuning
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.initialization-fail-timeout=-1

# 🛡️ PostgreSQL / Hibernate Safety
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# 🔑 App Security
pos.jwt.secret=${JWT_SECRET}
pos.jwt.expiration=${JWT_EXPIRATION:604800000}
app.allowed.origins=${ALLOWED_ORIGINS:*}

# ☁️ Cloud Storage
gcp.project-id=${GCP_PROJECT_ID}
gcp.bucket-name=${GCP_BUCKET_NAME}

# 🚀 Robustness: Don't kill the app if DB is slow at start
management.health.db.enabled=false
management.endpoint.health.show-details=always
