spring.application.name=pos-server
server.port=8080

# 🚩 THE "QUICK SUCCESS" CONFIG
management.health.db.enabled=false
management.endpoint.health.show-details=always

# 🐘 PostgreSQL / Cloud SQL Configuration
# Ensure the DB_URL secret starts with: jdbc:postgresql:///posdb?cloudSqlInstance=...
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ⚡ Extreme Resilience
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=60000

# 🛡️ PostgreSQL Keyword Protection
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# 🔄 Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# 🔑 Security
pos.jwt.secret=${JWT_SECRET}
pos.jwt.expiration=${JWT_EXPIRATION:604800000}
app.allowed.origins=${ALLOWED_ORIGINS:*}

# ☁️ GCP
gcp.project-id=${GCP_PROJECT_ID}
gcp.bucket-name=${GCP_BUCKET_NAME}

# 🛠️ Forced Port Logging
logging.level.org.springframework.web=INFO
logging.level.com.pos.server=DEBUG
