spring.application.name=pos-server
server.port=${PORT:8080}

# 🚩 EMERGENCY SAFETY BYPASS
management.health.db.enabled=false
spring.main.allow-bean-definition-overriding=true

# 🐘 PostgreSQL / Cloud SQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ⚡ Hikari Resilience (Java 11 Optimized)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=60000

# 🛡️ JPA / Hibernate - NO HANG DURING BOOT
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# Prevent Hibernate from hanging while trying to "detect" the DB version
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# 🔑 Security (Default added to prevent null crashes)
pos.jwt.secret=${JWT_SECRET:pos_system_ultra_secure_secret_key_1234567890_99}
pos.jwt.expiration=${JWT_EXPIRATION:604800000}
app.allowed.origins=${ALLOWED_ORIGINS:*}

# ☁️ GCP
gcp.project-id=${GCP_PROJECT_ID}
gcp.bucket-name=${GCP_BUCKET_NAME}

# 📝 Logging
logging.level.org.springframework=INFO
logging.level.com.pos.server=DEBUG
