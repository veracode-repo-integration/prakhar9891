spring.application.name=pos-server
server.port=8080

# 🚩 THE "GREEN LIGHT" FIX
# This prevents the database from failing the Cloud Run health check.
management.health.db.enabled=false
management.endpoint.health.show-details=always

# 🐘 PostgreSQL / Cloud SQL Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ⚡ Extreme Resilience
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=60000

# 🛡️ JPA / Hibernate - PostgreSQL PROTECTIONS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# 🔄 Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# 🔑 Security Defaults
pos.jwt.secret=${JWT_SECRET:pos_system_ultra_secure_secret_key_1234567890_99}
pos.jwt.expiration=${JWT_EXPIRATION:604800000}
app.allowed.origins=${ALLOWED_ORIGINS:*}

# ☁️ GCP
gcp.project-id=${GCP_PROJECT_ID}
gcp.bucket-name=${GCP_BUCKET_NAME}

# 📝 Debug Logs (This will now show up in Cloud Logging because the app stays alive)
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.pos.server=DEBUG
