spring.application.name=pos-server
server.port=4000

# H2 Database Configuration (File-based persistance to match previous db.json behavior)
spring.datasource.url=jdbc:h2:file:./data/posdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Jackson serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Cors
server.cors.allowed-origins=*
