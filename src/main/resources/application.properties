server.port=4000
spring.application.name=pos-server

# 🐘 PostgreSQL Core
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ⚡ Connection Pool Resilience
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=60000

# 🛡️ JPA - EMERGENCY GREEN MODE
# We will NOT change this to 'update' until we see /actuator/health say UP.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# 🔑 App Security
pos.jwt.secret=POS_ULTRA_SECURE_KEY_2026_XYZ
app.allowed.origins=*

# ☁️ Cloud Storage
gcp.project-id=udhyog-khaata-pos
gcp.bucket-name=pos-system-images-99

management.endpoint.health.show-details=always
management.health.db.enabled=true
logging.level.org.springframework=INFO
