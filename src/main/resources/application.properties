server.port=4000
spring.application.name=pos-server

# 🐘 PostgreSQL / Cloud SQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ⚡ EMERGENCY STARTUP (Green Mode)
# This tells the app: "Start the web server even if the DB is slow/missing"
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3

# 🛡️ JPA - DISABLE STARTUP CHECKS
# This prevents the 60-second hang during boot.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# 🔑 App Security
pos.jwt.secret=POS_ULTRA_SECURE_KEY_2026_XYZ
app.allowed.origins=*

# ☁️ Cloud Storage
gcp.project-id=udhyog-khaata-pos
gcp.bucket-name=pos-system-images-99

management.health.db.enabled=false
logging.level.org.springframework=INFO
