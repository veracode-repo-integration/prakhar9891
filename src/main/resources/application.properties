server.port=4000
spring.application.name=pos-server

# 🐘 PostgreSQL Core
spring.datasource.url=jdbc:postgresql:///posdb
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ☁️ Cloud SQL Socket Factory (Modern Config)
spring.datasource.hikari.driver-properties.socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.hikari.driver-properties.cloudSqlInstance=udhyog-khaata-pos:us-central1:pos-db-instance

# ⚡ Resilience
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=30000

# 🛡️ JPA - Table Creation is now ACTIVE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# 🔑 App Security
pos.jwt.secret=POS_ULTRA_SECURE_KEY_2026_XYZ
app.allowed.origins=*

# ☁️ Cloud Storage
gcp.project-id=udhyog-khaata-pos
gcp.bucket-name=pos-system-images-99

# 🏥 Detailed Health (Shows why DB is DOWN)
management.endpoint.health.show-details=always
management.health.db.enabled=true
logging.level.org.springframework=INFO
