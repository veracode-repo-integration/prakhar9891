spring.application.name=pos-server
server.port=8080

# 🐘 PostgreSQL / Cloud SQL Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ⚡ Extreme Resilience for Cloud Run Startup
# This forces the app to listen on the port even if the DB connection is still pending
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=60000

# 🛡️ JPA / Hibernate - PostgreSQL PROTECTIONS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Jackson serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# 📊 Actuator Configuration (Public)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# 🔑 Security (Default values to prevent OOM/Null crashes)
pos.jwt.secret=${JWT_SECRET:pos_system_ultra_secure_secret_key_1234567890_99}
pos.jwt.expiration=${JWT_EXPIRATION:604800000}
app.allowed.origins=${ALLOWED_ORIGINS:*}

# ☁️ GCP
gcp.project-id=${GCP_PROJECT_ID}
gcp.bucket-name=${GCP_BUCKET_NAME}

# Logging
logging.level.org.springframework=INFO
logging.level.com.pos.server=DEBUG
