spring.application.name=pos-server
server.port=${PORT:8080}

# 🐘 PostgreSQL / Cloud SQL Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - PostgreSQL PROTECTIONS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# The Magic Bullet: This makes all table and column names safe for PostgreSQL
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Jackson serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Security
pos.jwt.secret=${JWT_SECRET:pos_system_ultra_secure_secret_key_1234567890}
pos.jwt.expiration=${JWT_EXPIRATION:604800000}
app.allowed.origins=${ALLOWED_ORIGINS:*}

# GCP
gcp.project-id=${GCP_PROJECT_ID}
gcp.bucket-name=${GCP_BUCKET_NAME}

# Logging for Debugging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
