spring.application.name=pos-server
server.port=8080

# 🌎 API Health Check (Must be fast)
management.health.db.enabled=false
management.endpoint.health.show-details=always

# 🐘 PostgreSQL Connection (Simplified for Cloud SQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ⚡ Connection Pool - Robust for Java 11
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.initialization-fail-timeout=-1

# 🛡️ PostgreSQL Protections
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# 🔑 Security
pos.jwt.secret=${JWT_SECRET}
pos.jwt.expiration=${JWT_EXPIRATION:604800000}
app.allowed.origins=${ALLOWED_ORIGINS:*}

# ☁️ GCP
gcp.project-id=${GCP_PROJECT_ID}
gcp.bucket-name=${GCP_BUCKET_NAME}

# 📝 Debug Logging
logging.level.org.springframework.web=INFO
logging.level.com.pos.server=DEBUG
logging.level.org.hibernate.SQL=DEBUG
