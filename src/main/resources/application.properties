# ☁️ SERVER CONFIG
server.port=${PORT:4000}
spring.application.name=pos-server

# ☁️ DIALECT FIX
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect

# ☁️ GOOGLE CLOUD OFFICIAL CONFIG (The Magic)
spring.cloud.gcp.sql.instance-connection-name=udhyog-khaata-pos:us-central1:pos-db-instance
spring.cloud.gcp.sql.database-name=posdb

# 🐘 DB Credentials
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:SQLDB123}

# ⚡ Hikari Resilience - START AT ALL COSTS (CRITICAL FOR DEBUGGING)
# 0 means "don't fail the app if the DB is down during startup"
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000

# 🛡️ JPA - LIVE TABLE SYNC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=true

# 🔑 App Security
pos.jwt.secret=${JWT_SECRET:POS_ULTRA_SECURE_KEY_2026_PRO_SYSTEM_99}
app.allowed.origins=*

# ☁️ Cloud Storage
gcp.project-id=udhyog-khaata-pos
gcp.bucket-name=pos-system-images-99

# 🏥 Detailed Health & Logging
management.endpoint.health.show-details=always
management.health.db.enabled=false
management.endpoints.web.exposure.include=health,info

# 📝 DIAGNOSTIC LOGGING (MAXIMUM VERBOSITY)
logging.level.root=INFO
logging.level.com.pos.server=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.google.cloud.sql=DEBUG
