spring.application.name=pos-server
server.port=${PORT:4000}

# MySQL Database Configuration (Local only, commented out to avoid conflict with Cloud PostgreSQL)
# spring.datasource.url=${MYSQL_URL:${DB_URL:jdbc:mysql://localhost:3306/posdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}}
# spring.datasource.username=${MYSQL_USER:${DB_USER:root}}
# spring.datasource.password=${MYSQL_PASSWORD:${DB_PASSWORD:password}}
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Jackson serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Cloudinary Configuration (Deprecated, using GCS)
# cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
# cloudinary.api-key=${CLOUDINARY_API_KEY:}
# cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always

# Security Configuration
pos.jwt.secret=${JWT_SECRET:pos_system_ultra_secure_secret_key_1234567890}
app.allowed.origins=${ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19000,http://localhost:19006,http://localhost:3000}

