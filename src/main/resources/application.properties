server.port=4000
spring.application.name=pos-server

# ☁️ GOOGLE CLOUD OFFICIAL CONFIG (The Magic)
spring.cloud.gcp.sql.instance-connection-name=udhyog-khaata-pos:us-central1:pos-db-instance
spring.cloud.gcp.sql.database-name=posdb

# 🐘 DB Credentials
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ⚡ Hikari Resilience
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=60000

# 🛡️ JPA - Table Creation (STILL NONE until we verify)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 🔑 App Security
pos.jwt.secret=POS_ULTRA_SECURE_KEY_2026_XYZ
app.allowed.origins=*

# ☁️ Cloud Storage
gcp.project-id=udhyog-khaata-pos
gcp.bucket-name=pos-system-images-99

# 🏥 Detailed Health
management.endpoint.health.show-details=always
management.health.db.enabled=true
logging.level.org.springframework=INFO
