spring:
  jpa:
    hibernate:
      ddl-auto: update # Changed to 'update' for the first PostgreSQL deployment to create tables
    show-sql: false

  # In production, hikari settings are tuned for Cloud Run
  datasource:
    hikari:
      maximum-pool-size: 5 # Cloud Run instances are ephemeral
      connection-timeout: 30000

# Strict security for production
app:
  allowed:
    origins: ${ALLOWED_ORIGINS:https://your-frontend-domain.com}

logging:
  level:
    root: INFO
    com.pos.server: INFO
