name: Backend Deploy to Cloud Run

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: udhyog-khaata-pos
  REGION: us-central1
  SERVICE_NAME: pos-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Google Auth
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: udhyog-khaata-pos

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v1'
        with:
          project_id: udhyog-khaata-pos

      - name: 'Docker Auth'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Container
        run: |-
          docker build -t us-central1-docker.pkg.dev/udhyog-khaata-pos/pos-repo/pos-backend:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/udhyog-khaata-pos/pos-repo/pos-backend:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy pos-backend \
            --image us-central1-docker.pkg.dev/udhyog-khaata-pos/pos-repo/pos-backend:${{ github.sha }} \
            --region us-central1 \
            --add-cloudsql-instances=udhyog-khaata-pos:us-central1:pos-db-instance \
            --memory=1Gi \
            --cpu=1 \
            --port=4000 \
            --timeout=600s \
            --allow-unauthenticated \
            --set-env-vars="SPRING_PROFILES_ACTIVE=prod,DB_URL=${{ secrets.DB_URL }},DB_USER=postgres,DB_PASSWORD=${{ secrets.DB_PASSWORD }},JWT_SECRET=POS_ULTRA_SECURE_KEY_2026_XYZ,GCP_PROJECT_ID=udhyog-khaata-pos,GCP_BUCKET_NAME=pos-system-images-99"
