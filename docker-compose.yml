version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pos-postgres
    restart: always
    environment:
      POSTGRES_DB: posdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: pos-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://db:5432/posdb
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=pos_system_ultra_secure_secret_key_1234567890
    depends_on:
      - db

volumes:
  postgres_data:
